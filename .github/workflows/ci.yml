name: CI

on:
  push:
    branches: ['**']
  pull_request:

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  # Fast feedback on the platform-agnostic engine. Runs on Linux because
  # Headunit.Core deliberately has no Windows dependencies.
  core:
    name: Core (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test tests/Headunit.Core.Tests/Headunit.Core.Tests.csproj -c Release

  # The real build. WPF cannot be compiled anywhere but Windows, so this is the
  # only job that proves the app itself builds.
  windows:
    name: App (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore Headunit.sln
      - run: dotnet build Headunit.sln -c Release --no-restore
      - run: dotnet test tests/Headunit.Core.Tests/Headunit.Core.Tests.csproj -c Release --no-build
